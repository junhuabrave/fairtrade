name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-engine:
    name: Build C++ Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Configure CMake
        run: |
          # Remove any stale build/cache from previous runs and create a fresh build dir
          rm -rf build
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build trading_engine_demo
        run: |
          cd build
          cmake --build . --target trading_engine_demo -- -j$(nproc)

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries
          path: build/

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        working-directory: apps/trading-ui
        run: |
          npm ci

      - name: Build UI
        working-directory: apps/trading-ui
        run: |
          npm run build --if-present

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/trading-ui/dist

  python-tests:
    name: Python Testplan / smoke tests
    runs-on: ubuntu-latest
    needs: build-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp testplan

      - name: Create temporary binlog with one record
        run: |
          python - <<'PY'
          import struct, time
          LOG_FMT = '<QQIB256s'
          ts = int(time.time() * 1_000_000_000)
          seq = 1
          data = b'ci-test'
          length = len(data)
          level = 2
          packed = struct.pack(LOG_FMT, ts, seq, length, level, data.ljust(256, b'\0'))
          open('tmp.binlog','wb').write(packed)
          print('written tmp.binlog')
          PY

      - name: Start receiver and run shipper
        run: |
          python tools/test-suite/scripts/receiver.py 8000 &
          sleep 1
          timeout 15s python tools/test-suite/scripts/fluent_bit_shipper.py --binlog tmp.binlog --endpoint http://127.0.0.1:8000/logs || true
          sleep 1
          pkill -f receiver.py || true

      - name: Show recent logs
        run: |
          echo '=== tmp.binlog hex ==='
          hexdump -C tmp.binlog | sed -n '1,10p' || true
