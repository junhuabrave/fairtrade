name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-engine:
    name: Build C++ Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build trading_engine_demo
        run: |
          cd build
          cmake --build . --target trading_engine_demo -- -j$(nproc)

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries
          path: build/

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        working-directory: apps/trading-ui
        run: |
          npm ci

      - name: Build UI
        working-directory: apps/trading-ui
        run: |
          npm run build --if-present

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/trading-ui/dist
